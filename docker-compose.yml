services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meeting-ast-postgres
    environment:
      POSTGRES_DB: meeting_ast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: meeting-ast-backend
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      PORT: 8080
      CONTAINER: "1"
    volumes:
      - ./secrets/gcp-service-account.json:/run/secrets/gcp-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meeting-ast-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8080
      BACKEND_WS: ws://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
