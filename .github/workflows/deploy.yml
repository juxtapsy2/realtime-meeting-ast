name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: juxtapsy2
          # PAT with read:packages + write:packages. GITHUB_TOKEN cannot push
          # to this user-namespaced registry.
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/juxtapsy2/realtime-meeting-ast/backend:latest
            ghcr.io/juxtapsy2/realtime-meeting-ast/backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/juxtapsy2/realtime-meeting-ast/frontend:latest
            ghcr.io/juxtapsy2/realtime-meeting-ast/frontend:${{ github.sha }}

  deploy:
    runs-on: [self-hosted, macOS, ARM64]
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend
        run: |
          kubectl -n meeting-ast set image deployment/backend \
            backend=ghcr.io/juxtapsy2/realtime-meeting-ast/backend:${{ github.sha }}
          kubectl -n meeting-ast rollout status deployment/backend --timeout=180s

      - name: Deploy frontend
        run: |
          kubectl -n meeting-ast set image deployment/frontend \
            frontend=ghcr.io/juxtapsy2/realtime-meeting-ast/frontend:${{ github.sha }}
          kubectl -n meeting-ast rollout status deployment/frontend --timeout=180s