worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Never let nginx close an idle client connection before cloudflared does:
  # a pooled connection that the origin has already closed surfaces as a
  # single 521 "host down" on the next request through the tunnel.
  keepalive_timeout 0;

  server {
    listen 80;

    # Uploads (meeting documents) up to the backend's26 MiB cap. nginx's
    # default 1 MB rejects larger bodies with413, and through the tunnel
    # that surfaces as a failed upload instead of a clean error.
    # client_body_timeout must cover the tunnel's slow inbound rate
    # (~100 KB/s), so a max-size file may take minutes to arrive.
    client_max_body_size 30m;
    client_body_timeout 600s;

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}